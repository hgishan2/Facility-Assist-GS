    <meta property="og:title" content="Facility Assist — Facility Maintenance & PPM Operations" />

      property="og:description"
      content="All-in-one multi-building facility maintenance platform for in-house and AMC contractor PPM reports, before/after repair & upgrade logs, daily work orders, overtime, utility meter readings, tenant schedules, Excel summaries, and offline field sync."
    />

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('siteledger_theme_mode');
          var a = localStorage.getItem('siteledger_theme_accent');
          var dark = m === 'dark' || (!m && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          if (a === 'royal' || a === 'amber' || a === 'emerald') {
            document.documentElement.dataset.accent = a;
          } else {
            document.documentElement.dataset.accent = 'royal';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-brand-100 selection:text-brand-900 dark:selection:bg-brand-900/60 dark:selection:text-brand-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
